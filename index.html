<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsRadar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --bg2: #111827;
    --bg3: #1a2438;
    --border: #1e3050;
    --rose: #c98878;
    --text: #e8f0fc;
    --text2: #9ab0cc;
    --text3: #5a7090;
    --green: #4ab880;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --gold: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; min-height:100%; }

  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(201,136,120,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(74,184,128,0.04) 0%, transparent 50%);
  }

  .container { max-width:720px; margin:0 auto; padding:24px 16px 48px; position:relative; z-index:1; }

  /* Header */
  .header { text-align:center; margin-bottom:28px; padding-top:8px; }
  .logo-wrap { display:flex; align-items:center; justify-content:center; gap:6px; }
  .logo { font-family:'Playfair Display', serif; font-size:34px; font-weight:700; letter-spacing:-0.5px; }
  .logo span { color:var(--rose); }
  .tagline { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--text3); margin-top:6px; }
  .date-badge {
    display:inline-block; margin-top:14px;
    background:var(--bg3); border:1px solid var(--border); border-radius:20px;
    padding:5px 16px; font-size:12px; color:var(--text2);
  }
  .date-badge span { color:var(--rose); font-weight:500; }
  .rex-dino {
    image-rendering:pixelated;
    animation: dino-bob 1.2s ease-in-out infinite;
    vertical-align:middle;
    filter: drop-shadow(0 0 6px rgba(74,184,128,0.5));
  }
  @keyframes dino-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Source filter */
  .filter-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 28px;
  }
  .filter-label {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 10px;
  }
  .filter-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--text3); }
  .chip.active {
    background: rgba(201,136,120,0.15);
    border-color: var(--rose);
    color: var(--rose);
  }

  /* Section */
  .section { margin-bottom: 36px; }
  .section-header {
    display:flex; align-items:center; gap:10px; margin-bottom: 16px; padding-left: 4px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
  }
  .section-bar {
    flex: 1; height: 1px; background: var(--border);
  }
  .section-count {
    font-size: 11px; color: var(--text3);
    background: var(--bg2); padding: 2px 10px; border-radius: 20px; border: 1px solid var(--border);
  }
  .section-ki .section-title { color: var(--purple); }
  .section-co .section-title { color: var(--blue); }
  .section-bo .section-title { color: var(--gold); }

  /* Story card */
  .stories { display:flex; flex-direction:column; gap: 12px; }
  .story {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.4s ease both;
  }
  .story::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width: 3px; background: var(--accent, var(--rose));
    border-radius: 3px 0 0 3px; opacity: 0.7;
  }
  .story.hidden { display: none; }

  .story-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  .story-source {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent, var(--rose));
    font-weight: 500;
  }
  .story-company {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 12px;
  }
  .story-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
    margin-bottom: 8px;
  }
  .story-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.55;
  }
  .story-date {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.5px;
  }

  /* States */
  .empty {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 24px 12px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  .loading {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 32px;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 1px;
  }

  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-wrap">
      <div class="logo">News<span>Radar</span></div>
      <svg class="rex-dino" width="40" height="40" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <rect x="5" y="7" width="6" height="4" fill="#4ab880"/>
        <rect x="4" y="8" width="1" height="3" fill="#4ab880"/>
        <rect x="10" y="8" width="2" height="1" fill="#4ab880"/>
        <rect x="11" y="9" width="2" height="1" fill="#4ab880"/>
        <rect x="12" y="10" width="1" height="1" fill="#4ab880"/>
        <rect x="5" y="5" width="2" height="3" fill="#4ab880"/>
        <rect x="3" y="3" width="4" height="3" fill="#4ab880"/>
        <rect x="2" y="4" width="2" height="1" fill="#4ab880"/>
        <rect x="2" y="5" width="1" height="1" fill="#c98878"/>
        <rect x="4" y="3" width="1" height="1" fill="#fff"/>
        <rect x="6" y="4" width="1" height="2" fill="#3d9966"/>
        <rect x="7" y="3" width="1" height="3" fill="#3d9966"/>
        <rect x="8" y="5" width="1" height="2" fill="#3d9966"/>
        <rect x="6" y="11" width="1" height="2" fill="#3d9966"/>
        <rect x="8" y="11" width="1" height="2" fill="#3d9966"/>
        <rect x="6" y="13" width="2" height="1" fill="#3d9966"/>
        <rect x="8" y="13" width="2" height="1" fill="#3d9966"/>
        <rect x="5" y="8" width="1" height="1" fill="#3d9966"/>
      </svg>
    </div>
    <div class="tagline">KI · Unternehmen · Börse — täglich auf Deutsch</div>
    <div class="date-badge">📅 <span id="datum">…</span></div>
  </div>

  <div class="filter-wrap">
    <div class="filter-label">🔍 Quelle filtern</div>
    <div class="filter-chips" id="filter-chips">
      <button class="chip active" data-source="ALL">Alle</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">Lade Nachrichten…</div>
  </div>

  <div class="footer">NewsRadar · täglich aktualisiert · Quellen: Bloomberg, FT, WSJ, Reuters, Barron's, WaPo, NYT, The Information, Substack, AI Supremacy</div>

</div>

<script>
  const SECTIONS = [
    { key: 'ki_stories',        title: '🤖 KI-Branche',        cls: 'section-ki', accent: '#a78bfa' },
    { key: 'unternehmen_stories', title: '🏢 Unternehmens-News', cls: 'section-co', accent: '#60a5fa' },
    { key: 'boerse_stories',    title: '📈 Börse & Gold',      cls: 'section-bo', accent: '#fbbf24' },
  ];

  let allData = null;
  let activeSource = 'ALL';

  async function load() {
    try {
      const r = await fetch('newsletter_latest.json?v=' + Date.now());
      if (!r.ok) throw new Error('fetch failed');
      allData = await r.json();
      render();
    } catch (e) {
      document.getElementById('content').innerHTML =
        '<div class="empty">Aktuell keine Nachrichten verfügbar.<br><br>' +
        'Die tägliche Routine läuft noch nicht — sobald sie eingerichtet ist, ' +
        'erscheinen hier jeden Morgen frische News.</div>';
    }
  }

  function render() {
    if (!allData) return;
    document.getElementById('datum').textContent = allData.datum || '';

    renderFilterChips();
    renderSections();
  }

  function renderFilterChips() {
    const sources = new Set();
    SECTIONS.forEach(s => {
      (allData[s.key] || []).forEach(story => {
        if (story.quelle) sources.add(story.quelle);
      });
    });

    const chipsEl = document.getElementById('filter-chips');
    chipsEl.innerHTML = '';

    const allChip = makeChip('ALL', 'Alle');
    chipsEl.appendChild(allChip);

    Array.from(sources).sort().forEach(src => {
      chipsEl.appendChild(makeChip(src, src));
    });
  }

  function makeChip(value, label) {
    const b = document.createElement('button');
    b.className = 'chip' + (activeSource === value ? ' active' : '');
    b.dataset.source = value;
    b.textContent = label;
    b.onclick = () => {
      activeSource = value;
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.dataset.source === value);
      });
      renderSections();
    };
    return b;
  }

  function renderSections() {
    const content = document.getElementById('content');
    content.innerHTML = '';

    SECTIONS.forEach(sec => {
      const stories = (allData[sec.key] || []).filter(s =>
        activeSource === 'ALL' || s.quelle === activeSource
      );

      const section = document.createElement('div');
      section.className = 'section ' + sec.cls;

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML =
        '<div class="section-title">' + sec.title + '</div>' +
        '<div class="section-bar"></div>' +
        '<div class="section-count">' + stories.length + '</div>';
      section.appendChild(header);

      const list = document.createElement('div');
      list.className = 'stories';

      if (stories.length === 0) {
        list.innerHTML = '<div class="empty">Keine Stories ' +
          (activeSource === 'ALL' ? 'in dieser Kategorie' : 'von ' + activeSource) +
          '.</div>';
      } else {
        stories.forEach((story, i) => {
          list.appendChild(makeStoryCard(story, sec.accent, i));
        });
      }

      section.appendChild(list);
      content.appendChild(section);
    });
  }

  function makeStoryCard(story, accent, index) {
    const div = document.createElement('div');
    div.className = 'story';
    div.style.setProperty('--accent', accent);
    div.style.animationDelay = (index * 0.05) + 's';

    const company = story.unternehmen
      ? '<span class="story-company">' + escapeHtml(story.unternehmen) + '</span>'
      : '';

    const datum = story.datum_artikel
      ? '<div class="story-date">📅 ' + formatDate(story.datum_artikel) + '</div>'
      : '';

    div.innerHTML =
      '<div class="story-meta">' +
        '<div class="story-source">' + escapeHtml(story.quelle || '') + '</div>' +
        company +
      '</div>' +
      '<div class="story-title">' + escapeHtml(story.titel || '') + '</div>' +
      '<div class="story-text">' + escapeHtml(story.text || '') + '</div>' +
      datum;

    return div;
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return escapeHtml(iso);
      return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {
      return escapeHtml(iso);
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  load();
</script>
</body>
</html>
