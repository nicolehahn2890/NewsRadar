<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1a">
<title>NewsRadar</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --bg2: #111827;
    --bg3: #1a2438;
    --border: #1e3050;
    --rose: #c98878;
    --text: #e8f0fc;
    --text2: #9ab0cc;
    --text3: #5a7090;
    --green: #4ab880;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --gold: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { color-scheme: dark; }
  html, body { background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; min-height:100%; }

  ::selection { background: rgba(201,136,120,0.35); }

  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(201,136,120,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 25%, rgba(167,139,250,0.05) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 85%, rgba(74,184,128,0.05) 0%, transparent 50%);
  }

  .container { max-width:720px; margin:0 auto; padding:28px 16px 48px; position:relative; z-index:1; }

  /* Header */
  .header { text-align:center; margin-bottom:30px; padding-top:8px; }
  .logo-wrap { display:flex; align-items:center; justify-content:center; gap:10px; }
  .logo {
    font-family:'Playfair Display', serif; font-size:36px; font-weight:700;
    letter-spacing:-0.5px;
  }
  .logo span { color:var(--rose); }
  .tagline { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--text3); margin-top:8px; }
  .date-badge {
    display:inline-block; margin-top:16px;
    background:linear-gradient(135deg, var(--bg3), var(--bg2));
    border:1px solid var(--border); border-radius:20px;
    padding:6px 18px; font-size:12px; color:var(--text2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .date-badge span { color:var(--rose); font-weight:500; }

  /* Rex with radar ping */
  .rex-wrap { position:relative; width:46px; height:46px; flex:0 0 auto; }
  .rex-wrap::before, .rex-wrap::after {
    content:''; position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(74,184,128,0.5);
    animation: radar-ping 2.6s ease-out infinite;
  }
  .rex-wrap::after { animation-delay: 1.3s; }
  .rex-dino {
    position:relative; z-index:1; width:100%; height:100%;
    image-rendering:pixelated;
    animation: dino-bob 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(74,184,128,0.45));
  }
  @keyframes radar-ping {
    0%   { transform:scale(0.55); opacity:0.8; }
    80%  { transform:scale(1.5);  opacity:0; }
    100% { transform:scale(1.5);  opacity:0; }
  }
  @keyframes dino-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Source filter */
  .filter-wrap {
    background: linear-gradient(135deg, var(--bg2), #131c2e);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .filter-label {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 10px;
  }
  .filter-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font-size: 11px;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--text3); transform: translateY(-1px); }
  .chip.active {
    background: rgba(201,136,120,0.16);
    border-color: var(--rose);
    color: var(--rose);
    box-shadow: 0 0 12px rgba(201,136,120,0.18);
  }

  /* Section */
  .section { margin-bottom: 38px; }
  .section-header {
    display:flex; align-items:center; gap:10px; margin-bottom: 16px; padding-left: 4px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
  }
  .section-bar {
    flex:1; height:1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .section-count {
    font-size: 11px; color: var(--text3);
    background: var(--bg2); padding: 2px 10px; border-radius: 20px; border: 1px solid var(--border);
  }
  .section-ki .section-title { color: var(--purple); }
  .section-co .section-title { color: var(--blue); }
  .section-bo .section-title { color: var(--gold); }
  .section-ki .section-count { color: var(--purple); border-color: rgba(167,139,250,0.3); }
  .section-co .section-count { color: var(--blue); border-color: rgba(96,165,250,0.3); }
  .section-bo .section-count { color: var(--gold); border-color: rgba(251,191,36,0.3); }

  /* Story card */
  .stories { display:flex; flex-direction:column; gap: 12px; }
  .story {
    background: linear-gradient(160deg, var(--bg2), #0f1626);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.4s ease both;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .story:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--accent, var(--rose)) 50%, var(--border));
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .story::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width: 3px; background: var(--accent, var(--rose));
    border-radius: 3px 0 0 3px; opacity: 0.75;
  }
  .story::after {
    content:''; position:absolute; right:-40px; top:-40px; width:120px; height:120px;
    border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, var(--accent, var(--rose)) 0%, transparent 70%);
    opacity: 0.06;
  }

  .story-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 9px;
  }
  .story-source {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent, var(--rose));
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .story-source::before {
    content:''; width:5px; height:5px; border-radius:50%;
    background: var(--accent, var(--rose));
    box-shadow: 0 0 6px var(--accent, var(--rose));
  }
  .story-company {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .story-title {
    font-family: 'Playfair Display', serif;
    font-size: 17.5px;
    font-weight: 700;
    line-height: 1.32;
    color: var(--text);
    margin-bottom: 8px;
  }
  .story-text {
    font-size: 13.5px;
    color: var(--text2);
    line-height: 1.6;
  }
  .story-date {
    margin-top: 11px;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .badge-heute {
    font-size: 9px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--green);
    background: rgba(74,184,128,0.12);
    border: 1px solid rgba(74,184,128,0.35);
    padding: 2px 8px; border-radius: 10px;
  }

  /* States */
  .empty {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 24px 12px;
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .skeleton {
    border-radius: 16px;
    border: 1px solid var(--border);
    height: 110px;
    margin-bottom: 12px;
    background: linear-gradient(100deg, var(--bg2) 40%, var(--bg3) 50%, var(--bg2) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
  }
  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 1px;
    line-height: 2;
  }
  .footer .stand { color: var(--text2); }

  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rex-dino, .rex-wrap::before, .rex-wrap::after, .story, .skeleton { animation: none; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-wrap">
      <div class="logo">News<span>Radar</span></div>
      <div class="rex-wrap">
        <svg class="rex-dino" viewBox="0 0 19 18" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-label="Rex">
          <rect x="9" y="0" width="10" height="1" fill="#4ab880"/>
          <rect x="8" y="1" width="2" height="1" fill="#4ab880"/>
          <rect x="10" y="1" width="1" height="1" fill="#fff"/>
          <rect x="11" y="1" width="8" height="1" fill="#4ab880"/>
          <rect x="8" y="2" width="11" height="1" fill="#4ab880"/>
          <rect x="8" y="3" width="4" height="1" fill="#4ab880"/>
          <rect x="13" y="3" width="1" height="1" fill="#fff"/>
          <rect x="15" y="3" width="1" height="1" fill="#fff"/>
          <rect x="8" y="4" width="9" height="1" fill="#4ab880"/>
          <rect x="8" y="5" width="4" height="1" fill="#4ab880"/>
          <rect x="0" y="6" width="1" height="1" fill="#4ab880"/>
          <rect x="7" y="6" width="5" height="1" fill="#4ab880"/>
          <rect x="0" y="7" width="2" height="1" fill="#4ab880"/>
          <rect x="6" y="7" width="7" height="1" fill="#4ab880"/>
          <rect x="0" y="8" width="3" height="1" fill="#4ab880"/>
          <rect x="5" y="8" width="9" height="1" fill="#4ab880"/>
          <rect x="0" y="9" width="16" height="1" fill="#4ab880"/>
          <rect x="1" y="10" width="12" height="1" fill="#4ab880"/>
          <rect x="15" y="10" width="1" height="1" fill="#4ab880"/>
          <rect x="2" y="11" width="10" height="1" fill="#4ab880"/>
          <rect x="3" y="12" width="9" height="1" fill="#4ab880"/>
          <rect x="4" y="13" width="7" height="1" fill="#4ab880"/>
          <rect x="5" y="14" width="2" height="1" fill="#4ab880"/>
          <rect x="9" y="14" width="2" height="1" fill="#4ab880"/>
          <rect x="5" y="15" width="2" height="1" fill="#4ab880"/>
          <rect x="9" y="15" width="2" height="1" fill="#4ab880"/>
          <rect x="5" y="16" width="2" height="1" fill="#4ab880"/>
          <rect x="9" y="16" width="2" height="1" fill="#4ab880"/>
          <rect x="5" y="17" width="3" height="1" fill="#4ab880"/>
          <rect x="10" y="17" width="3" height="1" fill="#4ab880"/>
        </svg>
      </div>
    </div>
    <div class="tagline">Tägliches Briefing: KI, Wirtschaft, Märkte</div>
    <div class="date-badge">📅 <span id="datum">…</span></div>
  </div>

  <div class="filter-wrap">
    <div class="filter-label">🔍 Quelle filtern</div>
    <div class="filter-chips" id="filter-chips">
      <button class="chip active" data-source="ALL">Alle</button>
    </div>
  </div>

  <div id="content">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="footer">
    NewsRadar · täglich aktualisiert · Quellen: Bloomberg, FT, WSJ, Reuters, Barron's, WaPo, NYT, The Information, Substack, AI Supremacy
    <div class="stand" id="stand"></div>
  </div>

</div>

<script>
  const SECTIONS = [
    { key: 'ki_stories',        title: '🤖 KI-Branche',        cls: 'section-ki', accent: '#a78bfa' },
    { key: 'unternehmen_stories', title: '🏢 Unternehmens-News', cls: 'section-co', accent: '#60a5fa' },
    { key: 'boerse_stories',    title: '📈 Börse & Gold',      cls: 'section-bo', accent: '#fbbf24' },
  ];

  let allData = null;
  let activeSource = 'ALL';

  async function load() {
    try {
      const r = await fetch('newsletter_latest.json?v=' + Date.now());
      if (!r.ok) throw new Error('fetch failed');
      allData = await r.json();
      render();
    } catch (e) {
      document.getElementById('content').innerHTML =
        '<div class="empty">🦖 Aktuell keine Nachrichten verfügbar.<br><br>' +
        'Sobald die tägliche Routine läuft, erscheinen hier jeden Morgen frische News.</div>';
    }
  }

  function render() {
    if (!allData) return;
    document.getElementById('datum').textContent = allData.datum || '';
    if (allData.generiert) {
      document.getElementById('stand').textContent = 'Stand: ' + formatDate(allData.generiert);
    }

    renderFilterChips();
    renderSections();
  }

  function renderFilterChips() {
    const sources = new Set();
    SECTIONS.forEach(s => {
      (allData[s.key] || []).forEach(story => {
        if (story.quelle) sources.add(story.quelle);
      });
    });

    const chipsEl = document.getElementById('filter-chips');
    chipsEl.innerHTML = '';

    const allChip = makeChip('ALL', 'Alle');
    chipsEl.appendChild(allChip);

    Array.from(sources).sort().forEach(src => {
      chipsEl.appendChild(makeChip(src, src));
    });
  }

  function makeChip(value, label) {
    const b = document.createElement('button');
    b.className = 'chip' + (activeSource === value ? ' active' : '');
    b.dataset.source = value;
    b.textContent = label;
    b.onclick = () => {
      activeSource = value;
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.dataset.source === value);
      });
      renderSections();
    };
    return b;
  }

  function renderSections() {
    const content = document.getElementById('content');
    content.innerHTML = '';

    SECTIONS.forEach(sec => {
      const stories = (allData[sec.key] || []).filter(s =>
        activeSource === 'ALL' || s.quelle === activeSource
      );

      const section = document.createElement('div');
      section.className = 'section ' + sec.cls;

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML =
        '<div class="section-title">' + sec.title + '</div>' +
        '<div class="section-bar"></div>' +
        '<div class="section-count">' + stories.length + '</div>';
      section.appendChild(header);

      const list = document.createElement('div');
      list.className = 'stories';

      if (stories.length === 0) {
        list.innerHTML = '<div class="empty">Keine Stories ' +
          (activeSource === 'ALL' ? 'in dieser Kategorie' : 'von ' + activeSource) +
          '.</div>';
      } else {
        stories.forEach((story, i) => {
          list.appendChild(makeStoryCard(story, sec.accent, i));
        });
      }

      section.appendChild(list);
      content.appendChild(section);
    });
  }

  function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function makeStoryCard(story, accent, index) {
    const div = document.createElement('div');
    div.className = 'story';
    div.style.setProperty('--accent', accent);
    div.style.animationDelay = (index * 0.05) + 's';

    const company = story.unternehmen
      ? '<span class="story-company">' + escapeHtml(story.unternehmen) + '</span>'
      : '';

    const heute = story.datum_artikel === todayIso()
      ? '<span class="badge-heute">Heute</span>'
      : '';

    const datum = story.datum_artikel
      ? '<div class="story-date">📅 ' + formatDate(story.datum_artikel) + heute + '</div>'
      : '';

    div.innerHTML =
      '<div class="story-meta">' +
        '<div class="story-source">' + escapeHtml(story.quelle || '') + '</div>' +
        company +
      '</div>' +
      '<div class="story-title">' + escapeHtml(story.titel || '') + '</div>' +
      '<div class="story-text">' + escapeHtml(story.text || '') + '</div>' +
      datum;

    return div;
  }

  function formatDate(iso) {
    try {
      // 'T00:00:00' erzwingt lokale Zeit — sonst kann das Datum je nach
      // Zeitzone des Geräts um einen Tag verrutschen
      const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T00:00:00') : new Date(iso);
      if (isNaN(d.getTime())) return escapeHtml(iso);
      return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {
      return escapeHtml(iso);
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  load();
</script>
</body>
</html>
